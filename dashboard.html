<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DictaFlow · Transcripts</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #16191f; --panel-2: #1c2027;
    --text: #f4f6f8; --muted: #9aa3ad; --accent: #6ea8fe; --border: #262b33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: rgba(13,15,18,.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
    padding: 18px 24px;
  }
  .title { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .title span { color: var(--accent); }
  .stats { display: flex; gap: 22px; margin-top: 10px; flex-wrap: wrap; }
  .stat { color: var(--muted); font-size: 13px; }
  .stat b { color: var(--text); font-size: 16px; font-weight: 600; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 24px 80px; }
  #search {
    width: 100%; padding: 12px 14px; margin-bottom: 22px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); font-size: 15px;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { outline: none; border-color: var(--accent); }
  .day-label {
    color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; margin: 26px 0 10px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px; position: relative;
  }
  .card:hover { border-color: #333a44; }
  .card .time { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .card .body { white-space: pre-wrap; word-break: break-word; }
  .card .copy {
    position: absolute; top: 12px; right: 12px; background: var(--panel-2);
    border: 1px solid var(--border); color: var(--muted); border-radius: 7px;
    padding: 4px 10px; font-size: 12px; cursor: pointer; opacity: 0;
    transition: opacity .12s;
  }
  .card:hover .copy { opacity: 1; }
  .card .copy:hover { color: var(--text); border-color: var(--accent); }
  .card .copy.done { color: #5fd08a; border-color: #5fd08a; }
  .raw { color: var(--muted); font-size: 13px; margin-top: 8px;
         padding-top: 8px; border-top: 1px solid var(--border); }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <div class="title">Dicta<span>Flow</span> · Transcripts</div>
  <div class="stats" id="stats"></div>
</header>
<div class="wrap">
  <input id="search" type="search" placeholder="Search transcripts…" autocomplete="off">
  <div id="list"><div class="empty">Loading…</div></div>
</div>
<script>
let ALL = [];

function fmtTime(ts) { return ts.slice(11); }      // HH:MM:SS
function fmtDay(ts) {
  const d = new Date(ts.replace(' ', 'T'));
  return d.toLocaleDateString(undefined,
    { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}
function esc(s) {
  return s.replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));
}

function render(entries) {
  const list = document.getElementById('list');
  if (!entries.length) {
    list.innerHTML = '<div class="empty">No transcripts match.</div>';
    return;
  }
  let html = '', lastDay = '';
  for (const e of entries) {
    const day = e.ts.slice(0, 10);
    if (day !== lastDay) { html += `<div class="day-label">${fmtDay(e.ts)}</div>`; lastDay = day; }
    html += `<div class="card">
      <button class="copy" data-text="${esc(e.text).replace(/"/g,'&quot;')}">Copy</button>
      <div class="time">${fmtTime(e.ts)} · ${e.words} word${e.words===1?'':'s'}</div>
      <div class="body">${esc(e.text)}</div>
      ${e.raw ? `<div class="raw"><b>Raw:</b> ${esc(e.raw)}</div>` : ''}
    </div>`;
  }
  list.innerHTML = html;
}

function applySearch() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  render(q ? ALL.filter(e => e.text.toLowerCase().includes(q)) : ALL);
}

document.getElementById('search').addEventListener('input', applySearch);

document.addEventListener('click', e => {
  if (e.target.classList.contains('copy')) {
    navigator.clipboard.writeText(e.target.dataset.text);
    e.target.textContent = 'Copied'; e.target.classList.add('done');
    setTimeout(() => { e.target.textContent = 'Copy'; e.target.classList.remove('done'); }, 1200);
  }
});

async function load() {
  const r = await fetch('/api/transcripts');
  const { entries, stats } = await r.json();
  ALL = entries;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${stats.count}</b> transcripts</div>
    <div class="stat"><b>${stats.total_words.toLocaleString()}</b> words</div>
    <div class="stat"><b>${stats.days}</b> day${stats.days===1?'':'s'}</div>`;
  applySearch();
}
load();
setInterval(load, 15000);   // auto-refresh so new dictations appear
</script>
</body>
</html>
